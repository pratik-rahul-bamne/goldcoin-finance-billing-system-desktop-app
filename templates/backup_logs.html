{% extends "base.html" %}
{% block title %}Backup Logs{% endblock %}
{% block page_icon %}🧾{% endblock %}
{% block page_title %}Backup Logs{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <div class="card-title">Recent Backup/Restore Log</div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Timestamp | Event</th></tr></thead>
      <tbody>
        {% for line in entries %}
        <tr><td style="font-family:monospace;">{{ line }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <div class="card-footer">
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Back</a>
  </div>
</div>
{% endblock %}
